# Desarrollo y despliegue en servidor local. Cambie TODAS las contraseñas en producción (.env).
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
  env_file: .env
  environment:
    DB_HOST: db
    DB_USERNAME: wms_app          # la app corre SIN permiso de modificar el ledger
    DB_PASSWORD: ${WMS_APP_PASSWORD:-wms_app_dev}
  depends_on:
    db: { condition: service_healthy }
  restart: unless-stopped

services:
  app:
    <<: *app
    ports: ["8080:8000"]           # http://localhost:8080 (HTTPS por Caddy en 443)
  worker:
    <<: *app
    command: php artisan queue:work --tries=3 --max-time=3600
    healthcheck: { disable: true } # no sirve HTTP
  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck: { disable: true }

  # Herramientas de desarrollo: migraciones, pruebas, formato. No requiere PHP en su PC.
  #   docker compose run --rm tools php artisan migrate
  #   docker compose run --rm tools php vendor/bin/pest
  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    working_dir: /app
    volumes:
      - .:/app
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: wms
      DB_USERNAME: wms_owner      # propietario: puede migrar
      DB_PASSWORD: ${WMS_OWNER_PASSWORD:-wms_owner_dev}
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: wms_owner
      POSTGRES_PASSWORD: ${WMS_OWNER_PASSWORD:-wms_owner_dev}
      POSTGRES_DB: wms
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_owner -d wms"]
      interval: 10s
      retries: 10
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  pgdata: {}
  caddy_data: {}
