# Reglas de capas por módulo (Clean Architecture). Falla el CI si alguien las viola.
# Presentación = panel Filament (app/Filament) y cualquier app/Modules/*/Presentation.
deptrac:
  paths:
    - ./app/Modules
    - ./app/Shared
    - ./app/Filament
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: app/(Modules/.*|Shared)/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: app/Modules/.*/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: app/(Modules/.*|Shared)/Infrastructure/.*
    - name: Presentation
      collectors:
        - type: directory
          value: app/(Filament|Modules/.*/Presentation)/.*
    - name: Framework
      collectors:
        - type: classNameRegex
          value: '#^(Illuminate|Spatie)\\.*#'
    - name: UiFramework
      collectors:
        - type: classNameRegex
          value: '#^(Filament|Livewire|Symfony\\Component\\HttpFoundation|BladeUI|Carbon)\\.*#'
    - name: AppModels
      collectors:
        - type: classNameRegex
          value: '#^App\\Models\\.*#'
  ruleset:
    Domain: []
    Application: [Domain]
    Infrastructure: [Domain, Application, Framework, AppModels]
    # La presentación usa casos de uso y objetos de dominio; nunca la infraestructura de un módulo.
    Presentation: [Domain, Application, Framework, UiFramework, AppModels]
